[project]
name = "ai-job-agent"
version = "1.0.0"
description = "Autonomous AI Job Application Agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "pymupdf>=1.22.0",
    "python-docx>=0.8.11",
    "apscheduler>=3.10.0",
    "jinja2>=3.1.2",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pytz>=2023.3"
]

[tool.vercel]
entrypoint = "main:app"

name: Daily AI Job Finder & Auto-Applier (12:00 AM IST)

on:
  schedule:
    # 18:30 UTC = 12:00 AM IST (Midnight)
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv and dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          uv pip install --system -r requirements.txt
          uv pip install --system google-genai pypdf beautifulsoup4 requests pyyaml playwright
          playwright install --with-deps chromium

      - name: Run AI Resume Job Finder Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          python agent.py

      - name: Upload Daily HTML Job Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-job-report
          path: output/*.html
